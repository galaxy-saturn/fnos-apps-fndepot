name: Update FnDepot Source

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-fnpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Dual-Arch FPK and Append to JSON
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          # 解析版本号并拼接 GitHub 专属直链
          VERSION=${TAG_NAME#v}
          BASE_NAME="banban-client-${VERSION}"
          URL_X86="https://github.com/${REPO}/releases/download/${TAG_NAME}/${BASE_NAME}-fnos-x64.fpk"
          URL_ARM="https://github.com/${REPO}/releases/download/${TAG_NAME}/${BASE_NAME}-fnos-arm64.fpk"
          
          # 从 GitHub Event 载荷中提取 Release 正文，并过滤掉 Downloads 表格及相关标题
          RELEASE_BODY=$(jq -r '.release.body // "暂无更新日志"' "$GITHUB_EVENT_PATH" \
            | sed -e '/^|/d' -e '/^##* *Download/Id' -e '/^##* *下载/d')
          
          echo "下载并校验 x86 包: $URL_X86"
          wget -q -O temp_x86.fpk "$URL_X86"
          SIZE_X86=$(stat -c '%s' temp_x86.fpk)
          HASH_X86=$(sha256sum temp_x86.fpk | awk '{print $1}')
          
          echo "下载并校验 arm64 包: $URL_ARM"
          wget -q -O temp_arm.fpk "$URL_ARM"
          SIZE_ARM=$(stat -c '%s' temp_arm.fpk)
          HASH_ARM=$(sha256sum temp_arm.fpk | awk '{print $1}')
          
          CURRENT_TIME=$(date -Iseconds)
          
          # 使用 jq 注入所有变量，追加新版本节点更新 fnpack.json
          jq --arg ver "$VERSION" \
             --arg time "$CURRENT_TIME" \
             --arg changelog "$RELEASE_BODY" \
             --arg url_x86 "$URL_X86" --argjson size_x86 "$SIZE_X86" --arg hash_x86 "$HASH_X86" \
             --arg url_arm "$URL_ARM" --argjson size_arm "$SIZE_ARM" --arg hash_arm "$HASH_ARM" \
             '.apps["banban.ai"].releases[$ver] = {
               updated_at: $time,
               changelog: $changelog,
               packages: {
                 x86: { download_url: $url_x86, size: $size_x86, sha256: $hash_x86 },
                 arm: { download_url: $url_arm, size: $size_arm, sha256: $hash_arm }
               }
             }' fnpack.json > tmp.json && mv tmp.json fnpack.json
             
          rm temp_x86.fpk temp_arm.fpk

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          git commit -m "Auto-update fnpack.json for release ${{ github.event.release.tag_name }}"
          git push
